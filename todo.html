<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brutalist Todo List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- From Uiverse.io by craig_8499 --> 
    <div class="brutalist-container">
      <div class="slab-bg slab-1"></div>
      <div class="slab-bg slab-2"></div>

      <div class="concrete-block">
        <div class="concrete-texture"></div>
        <div class="paper-texture"></div>

        <div class="main-content">
          <div class="title-text">TASKS</div>

          <div class="todo-grid">
            <div class="todo-item">
              <input type="checkbox" id="task1" class="todo-checkbox" />
              <label for="task1" class="todo-label"
                >Complete project prototype</label
              >
            </div>
            <div class="todo-item">
              <input type="checkbox" id="task2" class="todo-checkbox" />
              <label for="task2" class="todo-label">Review client feedback</label>
            </div>
            <div class="todo-item">
              <input type="checkbox" id="task3" class="todo-checkbox" />
              <label for="task3" class="todo-label">Update documentation</label>
            </div>
            <div class="todo-item">
              <input type="checkbox" id="task4" class="todo-checkbox" />
              <label for="task4" class="todo-label">Team meeting @ 3PM</label>
            </div>
            <div class="todo-item">
              <input type="checkbox" id="task5" class="todo-checkbox" />
              <label for="task5" class="todo-label">Fix responsive issues</label>
            </div>
            <div class="todo-item">
              <input type="checkbox" id="task6" class="todo-checkbox" />
              <label for="task6" class="todo-label">Deploy to staging</label>
            </div>
          </div>
        </div>

        <div class="scan-effect"></div>

        <div class="rivet"></div>
        <div class="rivet"></div>
        <div class="rivet"></div>
        <div class="rivet"></div>
      </div>

      <div class="type-accent">SYS//TASK_MANAGER</div>

      <div class="corner-bracket bracket-tl"></div>
      <div class="corner-bracket bracket-tr"></div>
      <div class="corner-bracket bracket-bl"></div>
      <div class="corner-bracket bracket-br"></div>
    </div>
</body>
</html>

<!doctype html>
<html lang="en" data-theme="peach">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>YouFloww — the cozy focus timer that makes you want to work</title>
    <meta name="description" content="YouFloww is a free, beautiful focus timer with a cute companion, ambient sound mixer, live wallpapers, tasks, journal, stats, streaks and live leaderboards. No sign-up needed." />
    <meta name="keywords" content="pomodoro timer, focus timer, study timer, productivity, lofi, ambient sounds, deep work, study with me" />
    <meta name="theme-color" content="#fff1e8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#140f22" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <link rel="canonical" href="https://youfloww.vercel.app/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://youfloww.vercel.app/" />
    <meta property="og:title" content="YouFloww — the cozy focus timer" />
    <meta property="og:description" content="Focus with Flowy: a cute timer, ambient sound mixer, live wallpapers, tasks, streaks & stats. Free, no sign-up." />
    <meta property="og:image" content="https://youfloww.vercel.app/icons/og.png" />
    <meta name="twitter:card" content="summary_large_image" />


    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "YouFloww",
        "url": "https://youfloww.vercel.app/",
        "applicationCategory": "ProductivityApplication",
        "operatingSystem": "Any (web browser)",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "description": "A free, cozy and beautiful focus timer with ambient sounds, live wallpapers, tasks, stats and streaks."
      }
    </script>

    <!-- Paint the right theme before React boots: no flash. -->
    <script>
      (function () {
        try {
          var p = JSON.parse(localStorage.getItem('floww:prefs') || '{}');
          var t = (p.state && p.state.theme) || 'peach';
          document.documentElement.dataset.theme = t;
        } catch (e) {}
      })();
    </script>
    <style>
      html, body { margin: 0; background: #fff1e8; }
      html[data-theme='midnight'], html[data-theme='nebula'] { background: #140f22; }
      #boot { position: fixed; inset: 0; display: grid; place-items: center; }
      #boot svg { width: 72px; height: 72px; animation: boot 1.1s cubic-bezier(.5,0,.5,1) infinite alternate; }
      @keyframes boot { from { transform: translateY(0) scale(1, 1); } to { transform: translateY(-14px) scale(.94, 1.06); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot" aria-hidden="true">
        <svg viewBox="0 0 120 120"><defs><linearGradient id="bg" x1=".2" y1="0" x2=".8" y2="1"><stop offset="0" stop-color="#FFC27A"/><stop offset=".5" stop-color="#FF8FA3"/><stop offset="1" stop-color="#9D7BFF"/></linearGradient></defs><path d="M60 10C73 29 102 45 102 74c0 23-19 38-42 38S18 97 18 74c0-29 29-45 42-64Z" fill="url(#bg)"/><ellipse cx="47" cy="75" rx="5.5" ry="7.5" fill="#2A1B3D"/><ellipse cx="73" cy="75" rx="5.5" ry="7.5" fill="#2A1B3D"/></svg>
      </div>
    </div>
    <noscript>
      <h1>YouFloww — cozy focus timer</h1>
      <p>YouFloww needs JavaScript to run. It is a free Pomodoro-style focus timer with ambient sounds, live wallpapers, tasks, stats and streaks.</p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Google Analytics (kept from v2) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-V3CLSWYVTF"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-V3CLSWYVTF');
    </script>
  </body>
</html>

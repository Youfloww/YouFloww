<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>New Tab</title>
<link rel="icon" href="icons/icon-32.png">
<link rel="stylesheet" href="newtab.css">
<script src="theme.js"></script>
</head>
<body>
<div class="bg" id="bg" aria-hidden="true"></div>
<div class="veil" aria-hidden="true"></div>

<header class="top">
  <a class="brand" href="https://youfloww.vercel.app" aria-label="Open YouFloww"><img src="icons/icon-48.png" alt="" width="28" height="28"><span>YouFloww</span></a>
  <div class="top-actions">
    <button class="chip" id="themeBtn" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">🌙</button>
    <button class="chip" id="bgBtn" type="button" aria-label="Next wallpaper" title="Next wallpaper">🖼️</button>
  </div>
</header>

<main class="stage">
  <section class="hero">
    <p class="greet" id="greet">Hello</p>
    <h1 class="clock tabular" id="clock" aria-live="off">--:--</h1>
    <p class="date" id="date"></p>
  </section>

  <form class="search glass" id="searchForm" role="search">
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="m20 20-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    <input id="q" type="text" autocomplete="off" spellcheck="false" placeholder="Search with your default engine" aria-label="Search">
  </form>

  <section class="intent">
    <label class="intent-label" for="intent">Today's focus</label>
    <input id="intent" class="intent-input" type="text" maxlength="90" autocomplete="off" placeholder="What is the one thing today?">
    <label class="done" id="doneWrap"><input type="checkbox" id="done"><span>Done</span></label>
  </section>

  <section class="timer glass" aria-label="Focus timer">
    <div class="ring" id="ring">
      <svg viewBox="0 0 120 120" aria-hidden="true"><circle class="trk" cx="60" cy="60" r="52"/><circle class="prg" id="prg" cx="60" cy="60" r="52"/></svg>
      <div class="ring-time tabular" id="tTime">25:00</div>
    </div>
    <div class="t-side">
      <div class="t-modes" role="radiogroup" aria-label="Length">
        <button type="button" class="pill" data-min="15" role="radio">15</button>
        <button type="button" class="pill on" data-min="25" role="radio">25</button>
        <button type="button" class="pill" data-min="50" role="radio">50</button>
      </div>
      <div class="t-btns">
        <button class="btn primary" id="tGo" type="button">Start focus</button>
        <button class="btn ghost" id="tReset" type="button" hidden>Reset</button>
      </div>
      <a class="handoff" id="handoff" href="https://youfloww.vercel.app" target="_blank" rel="noopener">Continue in the full app &rarr;</a>
    </div>
  </section>

  <nav class="links" id="links" aria-label="Quick links"></nav>
</main>

<footer class="foot">
  <a class="open btn primary" href="https://youfloww.vercel.app" id="openApp">Open YouFloww</a>
</footer>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<dialog id="linkDlg" class="dlg">
  <form method="dialog" id="linkForm">
    <h2>Add a quick link</h2>
    <input id="lName" placeholder="Name (e.g. Docs)" maxlength="18" aria-label="Name" required>
    <input id="lUrl" placeholder="https://example.com" aria-label="Address" required>
    <div class="dlg-btns"><button class="btn ghost" value="cancel" type="button" id="lCancel">Cancel</button><button class="btn primary" type="submit">Add</button></div>
  </form>
</dialog>
<script src="newtab.js"></script>
</body>
</html>
